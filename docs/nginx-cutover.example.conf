# Пример для волны 3 SEO (cutover). Не подключать на staging как есть.
# 1) HTTPS server_name mos-agro.ru www.mos-agro.ru
# 2) редирект IP и www → https://mos-agro.ru
# 3) root /var/www/mosagro/public; PHP-FPM как сейчас

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name mos-agro.ru www.mos-agro.ru 87.242.65.116;
    return 301 https://mos-agro.ru$request_uri;
}

# www → apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.mos-agro.ru;
    # ssl_certificate ...;
    # ssl_certificate_key ...;
    return 301 https://mos-agro.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mos-agro.ru;
    # ssl_certificate /etc/letsencrypt/live/mos-agro.ru/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/mos-agro.ru/privkey.pem;
    root /var/www/mosagro/public;
    index index.php;
    client_max_body_size 32M;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location ^~ /storage/ {
        location ~* \.(?i:php|phtml|phar|cgi|pl)$ { deny all; }
        try_files $uri =404;
        access_log off;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
    }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
