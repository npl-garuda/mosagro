server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/mosagro/public;
    index index.php;
    client_max_body_size 32M;
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location ^~ /storage/ {
        location ~* \.(?i:php|phtml|phar|cgi|pl)$ {
            deny all;
        }
        try_files $uri =404;
        access_log off;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
    }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
